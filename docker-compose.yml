version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: orchestrator-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_NAME:-ouroboros_orchestrator_db}
    ports:
      - "${DOCKER_MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  orchestrator:
    build: .
    container_name: orchestrator-service
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=${DB_NAME:-ouroboros_orchestrator_db}
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-root_password}
      - ALLOW_DB_FAILURE=false
      - LOG_LEVEL=DEBUG
    volumes:
      - .:/app
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mysql_data:
