# OuroborosAI Orchestrator — CI/CD
#
# Stages: lint-quality + unit-tests (parallel) → type-check, integration-tests,
#         security (Bandit + Snyk) → Docker GHCR (push image on merge to main) → Trivy (main).
#
# Action major tags (verified on GitHub):
#   actions/checkout@v6 — https://github.com/actions/checkout/releases
#   actions/setup-python@v6 — https://github.com/actions/setup-python/releases
#   actions/upload-artifact@v6 — https://github.com/actions/upload-artifact/releases
#   docker/setup-buildx-action@v4 — https://github.com/docker/setup-buildx-action/releases
#   docker/build-push-action@v7 — https://github.com/docker/build-push-action/releases
#
# Older action bundles shipped with Node 20; newer majors run on Node 24.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/

name: OuroborosAI Orchestrator CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ---------------------------------------------------------------------------
  # Stage 1: Lint & unit tests (parallel)
  # ---------------------------------------------------------------------------
  lint-quality:
    name: Lint & Formatting
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check formatting (Black)
        run: black --check --diff app/ tests/

      - name: Check import sorting (isort)
        run: isort --check-only --diff app/ tests/

      - name: Lint (flake8)
        run: flake8 app/ tests/ --max-line-length=120 --extend-ignore=E203,W503,E501

      - name: Lint (pylint)
        run: pylint app/ tests/ --max-line-length=120 --disable=C0111,R0903

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          ALLOW_DB_FAILURE: "true"
          USE_MOCK_DATA: "true"
          MYSQL_HOST: "localhost"
          MYSQL_DATABASE: "test_db"
          MYSQL_USER: "test_user"
          MYSQL_PASSWORD: "test_pass"
        run: pytest tests/unit/ -v --tb=short --junitxml=junit-report.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: junit-report.xml
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Stage 2: Type check, coverage, static + dependency security (parallel)
  # ---------------------------------------------------------------------------
  type-check:
    name: Type Checking (mypy)
    runs-on: ubuntu-latest
    needs: [lint-quality, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run mypy
        run: mypy app/ --ignore-missing-imports --no-strict-optional

  integration-tests:
    name: Tests with Coverage
    runs-on: ubuntu-latest
    needs: [lint-quality, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests with coverage
        env:
          ALLOW_DB_FAILURE: "true"
          USE_MOCK_DATA: "true"
          MYSQL_HOST: "localhost"
          MYSQL_DATABASE: "test_db"
          MYSQL_USER: "test_user"
          MYSQL_PASSWORD: "test_pass"
        run: pytest tests/ --cov=app --cov-report=html --cov-report=xml -v

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  security-static:
    name: Security Scan (Bandit)
    runs-on: ubuntu-latest
    needs: [lint-quality, unit-tests]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dev dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Bandit (JSON; fails on findings)
        run: bandit -r app/ -f json -o bandit-report.json

      - name: Upload Bandit report
        if: always() && hashFiles('bandit-report.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: security-reports-bandit
          path: bandit-report.json
          retention-days: 7

  security-scan:
    name: Security Scan (Snyk OSS)
    runs-on: ubuntu-latest
    needs: [lint-quality, unit-tests]
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Skip Snyk (no token)
        if: env.SNYK_TOKEN == ''
        run: echo "SNYK_TOKEN not set; skipping Snyk OSS scan. Add repo secret to enforce dependency checks."

      - name: Setup Snyk CLI
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/setup@v1.0.0

      - name: Snyk Open Source scan (Python requirements)
        if: env.SNYK_TOKEN != ''
        run: |
          snyk auth "$SNYK_TOKEN"
          snyk test \
            --file=requirements.txt \
            --severity-threshold=high \
            --sarif-file-output=snyk.sarif

      - name: Upload Snyk SARIF to Code Scanning
        if: vars.ENABLE_CODE_SCANNING_SARIF == 'true' && env.SNYK_TOKEN != '' && always() && hashFiles('snyk.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk.sarif

      - name: Upload Snyk SARIF artifact
        if: env.SNYK_TOKEN != '' && always() && hashFiles('snyk.sarif') != ''
        uses: actions/upload-artifact@v6
        with:
          name: snyk-sarif
          path: snyk.sarif

  # ---------------------------------------------------------------------------
  # Stage 3: Docker build → GHCR (push image only when merging to main, not on PR)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs:
      - type-check
      - integration-tests
      - security-static
      - security-scan
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Stage 4: Trivy (after image push to GHCR on main)
  # ---------------------------------------------------------------------------
  trivy-scan:
    name: Trivy Scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [docker-build]
    permissions:
      contents: read
      packages: read
      security-events: write
      actions: read
    steps:
      - name: Log in to GitHub Container Registry (pull)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: sarif
          output: trivy.sarif

      - name: Upload Trivy SARIF to Code Scanning
        if: vars.ENABLE_CODE_SCANNING_SARIF == 'true' && always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy.sarif

      - name: Run Trivy vulnerability scanner (JSON artifact)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          format: json
          output: trivy-results.json

      - name: Upload Trivy report artifact
        if: always() && hashFiles('trivy-results.json') != ''
        uses: actions/upload-artifact@v6
        with:
          name: trivy-report
          path: trivy-results.json

  # ---------------------------------------------------------------------------
  # Stage 5: Summary (does not gate on Trivy; Trivy only on main push)
  # ---------------------------------------------------------------------------
  reports-summary:
    name: CI Summary & Report Bundle
    runs-on: ubuntu-latest
    needs:
      - lint-quality
      - unit-tests
      - type-check
      - integration-tests
      - security-static
      - security-scan
      - docker-build
    if: always()
    permissions:
      contents: read
      actions: read
    steps:
      - name: Create CI summary
        run: |
          {
            echo "# OuroborosAI Orchestrator — CI Reports";
            echo "- Commit: $GITHUB_SHA";
            echo "- Ref: $GITHUB_REF";
            echo "- Container image: ghcr.io/${{ github.repository }}";
            echo "";
            echo "## Job results";
            echo "- Lint & Formatting: ${{ needs.lint-quality.result }}";
            echo "- Unit Tests: ${{ needs.unit-tests.result }}";
            echo "- Type Check (mypy): ${{ needs.type-check.result }}";
            echo "- Tests + Coverage: ${{ needs.integration-tests.result }}";
            echo "- Bandit: ${{ needs.security-static.result }}";
            echo "- Snyk OSS: ${{ needs.security-scan.result }}";
            echo "- Docker Build/Push: ${{ needs.docker-build.result }}";
            echo "";
            echo "_Trivy image scan runs after each successful image push to GHCR from main._";
          } > summary.md

      - name: Upload consolidated report bundle
        uses: actions/upload-artifact@v6
        with:
          name: ci-reports
          path: summary.md
